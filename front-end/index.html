<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pedex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="imagens/logopedexpainel.png" type="">
  <style>
    .btn-tipo-entrega {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #ff0000;
      background: #fff;
      color: #ff0000;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-tipo-entrega.ativo {
      background: #ff0000;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <img src="imagens/logo-pedex.png" alt="Pedex" class="logo">
  </header>

  <!-- ENDEREÇO -->
  <section class="endereco-wrapper">
    <div class="endereco-card">

      <!-- TOGGLE ENTREGA / RETIRADA -->
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button id="btnEntrega" class="btn-tipo-entrega ativo">
           Entrega
        </button>
        <button id="btnRetirada" class="btn-tipo-entrega">
          Retirar na loja
        </button>
      </div>

      <!-- BLOCO ENTREGA -->
      <div id="blocoEntrega">
        <div class="endereco-texto">
          <span class="titulo" id="labelEnderecoCarrinho">Entregar em</span>
          <span class="endereco" id="textoEndereco">Informe seu endereço</span>
        </div>

        <button class="btn-endereco" id="btnEndereco">
          Adicionar endereço <span class="seta">➜</span>
        </button>

        <div id="camposEndereco" style="display:none;">
          <input type="text" id="inputRua" class="input-endereco" placeholder="Nome da rua">
          <input type="text" id="inputNumero" class="input-endereco" placeholder="Número da casa">
          <input type="text" id="inputComplemento" class="input-endereco" placeholder="Complemento (apto, bloco...)">
          <input type="text" id="inputReferencia" class="input-endereco" placeholder="Ponto de referência">
          <button class="btn-salvar" id="btnSalvarEndereco">Salvar endereço</button>
        </div>
      </div>

      <!-- BLOCO RETIRADA -->
      <div id="blocoRetirada" style="display:none;">
        <div class="endereco-texto">
          <span class="titulo">Retirada</span><br>
          <span class="endereco">Você vai retirar o pedido diretamente na loja</span>
        </div>
      </div>

    </div>
  </section>

  <!-- LOJAS -->
  <section class="lojas-section">
    <h2 class="titulo-section">Lojas parceiras</h2>

    <!-- BURGER -->
    <div class="loja-card"
         data-abre="16:00"
         data-fecha="22:35"
         onclick="window.location.href='hamburgueria.html'">
      <img src="imagens/logo.bur.png" class="logo-loja">
      <div class="info-loja">
        <span class="nome-loja">Burger House</span>
        <span class="status-loja"></span>
      </div>
      <span class="seta-loja">➜</span>
    </div>

    <!-- PIZZARIA -->
    <div class="loja-card"
         data-abre="18:00"
         data-fecha="23:30"
         onclick="window.location.href='pizzaria.html'">
      <img src="imagens/logo.pizzaria.png" class="logo-loja">
      <div class="info-loja">
        <span class="nome-loja">Alô Pizza!</span>
        <span class="status-loja"></span>
      </div>
      <span class="seta-loja">➜</span>
    </div>

    <!-- BABAÇU STEAKHOUSE -->
    <div class="loja-card"
         data-abre="17:00"
         data-fecha="23:30"
         onclick="window.location.href='babacu.html'">
      <img src="imagens/babacu/logobabacu.jpeg" class="logo-loja">
      <div class="info-loja">
        <span class="nome-loja">Babaçu Steakhouse</span>
        <span class="status-loja"></span>
      </div>
      <span class="seta-loja">➜</span>
    </div>

    <!-- DELLA MAMA PIZZARIA -->
    <div class="loja-card"
         data-abre="18:00"
         data-fecha="23:59"
         onclick="window.location.href='dellamama.htm'">
      <img src="imagens/dellamama/logodellamama.jpeg" class="logo-loja">
      <div class="info-loja">
        <span class="nome-loja">Della Mama Pizzaria</span>
        <span class="status-loja"></span>
      </div>
      <span class="seta-loja">➜</span>
    </div>

  </section>

  <footer style="text-align:center; padding:24px 16px 8px; color:#999; font-size:12px;">
    <a href="privacidade.html" style="color:#c40000; text-decoration:none; font-weight:bold;">
      Política de Privacidade
    </a>
    &nbsp;•&nbsp;
    <a href="termos.html" style="color:#c40000; text-decoration:none; font-weight:bold;">
      Termos de Uso
    </a>
  </footer>

  <script src="js/lojas.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
